# Model registry. Every run copies the resolved block below into its run manifest,
# and analyze.py reads the provider-reported model name from each Inspect log.
#
# Rules
# - IDs are full Inspect model strings (provider/model). No floating "latest" aliases.
# - scripts/run_arm.py refuses to start if any REQUIRED field is null.
# - Any change after the freeze (docs/PREREGISTRATION.md) is a logged deviation.
#
# Decisions (2026-11-06):
# - U = ControlArena's default untrusted model.
# - T comes from a DIFFERENT model family than U (safety case assumption 2), so the
#   monitor and the agent share fewer failure modes. T = GPT-4.1 mini, pinned snapshot.
# - temperature: T at 1.0 = provider default (what stock ControlArena passes).
#   U: Anthropic removed the temperature parameter in API version 2026-10-21 (Inspect warns and
#   drops it), so U's temperature is null with temperature_unsupported: true. Sampling is the
#   provider's fixed behavior; the API version in force is recorded via the Inspect log.

version: "0.1-draft"

untrusted:            # U: frontier model doing the work
  id: anthropic/claude-opus-5-5
  temperature: null
  temperature_unsupported: true   # Anthropic API >= 2026-10-21 rejects temperature
  max_tokens: null
  reasoning: null

trusted:              # T: monitor, deferral fallback, and the T0 usefulness floor
  id: openai/gpt-4.1-mini-2025-04-14   # chosen 2026-11-06: cross-family, non-reasoning, dated snapshot
  temperature: 1.0
  max_tokens: null
